name: Workflow lint

# Static analysis of the workflow files themselves (issue #27) — correctness
# (actionlint) and security posture (zizmor: unpinned actions, excessive
# permissions, script-injection risk) — separate from CI's own build/test,
# which never inspects the workflows that run it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # required by reviewdog's github-pr-check reporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@7abf25e1607ec65838b73d0484ff31f8e9499d80 # v1.81.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          fail_level: error

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload zizmor's SARIF results
      actions: read # lets zizmor audit this repo's workflow run configuration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
