name: Release

# Standard changesets flow: on every push to main, either open/update a
# "Version Packages" PR (if there are pending changesets) or, once that PR
# has been merged (so there are no pending changesets left), publish the
# packages whose versions just changed. No publish happens on a push that
# doesn't come through a merged version PR — changesets diffs against the
# last published versions to decide what's actually new.
#
# Dormant until:
#  1. An NPM_TOKEN secret (an npm automation token with publish rights to
#     the @archsmith scope) is added under this repo's Settings > Secrets.
#  2. At least one changeset exists (`npx changeset` from a PR branch).

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
