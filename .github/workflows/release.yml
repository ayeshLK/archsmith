name: Release

# Manual-trigger-only (workflow_dispatch), by design — publishing is always
# an explicit action, never a side effect of merging a PR. Standard
# changesets flow, needing two separate manual runs of this workflow with a
# PR merge in between: run 1, with pending changesets present, opens/updates
# a "Version Packages" PR (bumps versions, updates changelogs) and publishes
# nothing; after that PR is merged, run 2 finds no pending changesets and
# publishes the packages whose versions just changed instead. See
# RELEASING.md for the full step-by-step and the internal-dependency-bump
# behavior this relies on.
#
# The release step below is skipped (not failed) if the NPM_TOKEN secret
# (an npm automation token with publish rights to the @archsmith scope)
# isn't configured under this repo's Settings > Secrets.

on:
  workflow_dispatch:

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action commits version bumps and tags releases
      pull-requests: write # changesets/action opens/updates the "Version Packages" PR
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Create release PR or publish
        if: env.NPM_TOKEN != ''
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npx changeset publish
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Skip (no NPM_TOKEN configured yet)
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN secret not set — skipping release step. Add it under Settings > Secrets when ready to publish."
