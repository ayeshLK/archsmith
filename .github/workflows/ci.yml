name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Explicitly Linux, not macOS — the whole point of the font-portability fix
    # (see project plan, Phase 1) is a bug that only manifests off macOS.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run security:audit
        if: matrix.node-version == '20.x'
      - run: npm run build
      - run: npm test
      - run: npm run check:examples
      - run: npm run build:pages
